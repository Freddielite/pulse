<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0f0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pulse</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Splash screen: shown instantly on load (no JS/React needed yet),
         removed once main.jsx signals the app has mounted and the
         cinematic sequence below has had time to play out. Sits above
         everything, matches the manifest's background/theme color, so
         there's no flash of blank white before it or mismatched color
         after it.

         The icon is inlined as SVG (not <img>) specifically so the
         pulse-line path can be animated with stroke-dashoffset: the
         line "traces" itself left to right like a heartbeat monitor
         reading, then settles into a slow glow-pulse - tying the
         motion to what the app actually does rather than a generic
         logo bounce. */
      #pl-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: radial-gradient(ellipse at center, #10201a 0%, #0a0f0d 65%);
        transition: opacity 0.4s ease;
      }
      #pl-splash.pl-splash-hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* Soft radial bloom behind the icon, blooming in and settling
         down to a dim ambient glow - the "screen waking up" beat. */
      .pl-splash-glow {
        position: absolute;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(61, 220, 132, 0.4), transparent 70%);
        filter: blur(2px);
        opacity: 0;
        animation: pl-glow-bloom 1.7s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }

      .pl-splash-icon {
        position: relative;
        width: 88px;
        height: 88px;
        opacity: 0;
        transform: scale(0.82);
        animation: pl-icon-in 1.7s cubic-bezier(0.16, 0.85, 0.24, 1) forwards;
      }

      .pl-splash-path {
        fill: none;
        stroke: #3ddc84;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 150;
        stroke-dashoffset: 150;
        animation: pl-draw 0.85s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards,
          pl-heartbeat-glow 1.3s ease-in-out 1.05s infinite;
      }

      @keyframes pl-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes pl-heartbeat-glow {
        0%,
        100% {
          filter: drop-shadow(0 0 4px rgba(61, 220, 132, 0.55));
        }
        50% {
          filter: drop-shadow(0 0 15px rgba(61, 220, 132, 1));
        }
      }
      @keyframes pl-glow-bloom {
        0% {
          opacity: 0;
          transform: scale(0.5);
        }
        45% {
          opacity: 1;
          transform: scale(1.15);
        }
        100% {
          opacity: 0.55;
          transform: scale(1);
        }
      }
      @keyframes pl-icon-in {
        0% {
          opacity: 0;
          transform: scale(0.82);
        }
        20% {
          opacity: 1;
        }
        60% {
          transform: scale(1.06);
        }
        80% {
          transform: scale(0.98);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Respect reduced-motion: keep the reveal but drop the moving
         parts (drawing, bloom, heartbeat flicker). */
      @media (prefers-reduced-motion: reduce) {
        .pl-splash-glow,
        .pl-splash-icon {
          animation: none !important;
          opacity: 1;
          transform: scale(1);
        }
        .pl-splash-path {
          stroke-dashoffset: 0;
          animation: none !important;
          filter: drop-shadow(0 0 6px rgba(61, 220, 132, 0.7));
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="pl-splash">
      <div class="pl-splash-glow"></div>
      <svg class="pl-splash-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path class="pl-splash-path" d="M8 50 H32 L40 28 L54 72 L64 50 H92" />
      </svg>
    </div>
    <script>
      // Timestamped here, inline, right as the splash markup lands -
      // the most accurate "the splash became visible" mark available,
      // used by main.jsx to guarantee the cinematic sequence gets its
      // full runtime regardless of how fast the module script loads.
      window.__plSplashStart = performance.now();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
